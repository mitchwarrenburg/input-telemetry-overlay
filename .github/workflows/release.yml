name: Release

# Called by CI once a push to main has passed its checks, as the next version; or run
# for a version tag pushed by hand (vX.Y.Z), as that version.
on:
  workflow_call:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, to find the latest release
      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          $tagged = git tag --points-at HEAD --list "v*" | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Substring(1)
          } elseif ($tagged) {
            # Released already (the workflow was re-run): the same release again.
            $version = $tagged.Substring(1)
          } else {
            # The latest release's patch + 1, or Cargo.toml's version when that's higher:
            # bump it there for a minor or major release.
            $cargo = [version](Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
            $latest = git tag --list "v*" |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Substring(1) } |
              Sort-Object -Descending |
              Select-Object -First 1
            $next = if ($latest) { [version]::new($latest.Major, $latest.Minor, $latest.Build + 1) } else { $cargo }
            $version = if ($cargo -gt $next) { $cargo } else { $next }
          }
          "Releasing v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Stamp the version
        shell: pwsh
        run: |
          # The exe's version info comes from Cargo.toml. This copy only; nothing is committed.
          $toml = Get-Content Cargo.toml -Raw
          $toml = ([regex]'(?m)^version = "[^"]*"').Replace($toml, 'version = "${{ steps.version.outputs.version }}"', 1)
          Set-Content Cargo.toml $toml -NoNewline
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A commit released from main has just passed CI; a tag could be on any commit.
      - if: github.ref_type == 'tag'
        run: cargo test
      - run: cargo build --release
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/input-telemetry-overlay.exe dist/
          Copy-Item README.md, LICENSE dist/
          Copy-Item assets/fonts/OFL.txt dist/FONT-LICENSE-OFL.txt
          Compress-Archive -Path dist/* -DestinationPath "input-telemetry-overlay-v${{ steps.version.outputs.version }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            target/installer/input-telemetry-overlay-*-windows-x64-setup.exe
            input-telemetry-overlay-*-windows-x64.zip
          generate_release_notes: true
