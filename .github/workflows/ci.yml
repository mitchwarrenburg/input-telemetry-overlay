name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: input-telemetry-overlay
          path: target/release/input-telemetry-overlay.exe

  # A push to main (a merged pull request, or a direct push) that passes the checks
  # above is released as the next version.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One release at a time, so merges close together get consecutive versions. (When
    # several wait, only the newest runs; its release notes cover the others.)
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
