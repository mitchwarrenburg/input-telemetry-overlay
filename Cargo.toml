[package]
name = "input-telemetry-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "iRacing overlay that graphs your throttle and brake against a Garage 61 reference lap"
license = "MIT"
repository = "https://github.com/mitchwarrenburg/input-telemetry-overlay"
readme = "README.md"
keywords = ["iracing", "telemetry", "overlay", "sim-racing", "garage61"]
categories = ["games", "visualization"]
exclude = ["prototype/*"]

[lib]
name = "ito"
path = "src/lib.rs"

[[bin]]
name = "input-telemetry-overlay"
path = "src/main.rs"

[dependencies]
# glow (OpenGL) is the renderer that gives a truly transparent window on Windows.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
winit = "0.30.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
log = "0.4"
png = "0.18"

[target.'cfg(windows)'.dependencies]
kerb = { version = "=0.4.0", default-features = false, features = ["iracing"] }
tray-icon = "0.25"
global-hotkey = "0.8"
rfd = "0.17"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
